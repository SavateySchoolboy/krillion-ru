<!doctype html><html lang="ru"><meta charset="utf-8"><title>Krillion RU — integration tests</title>
<style>body{font:16px system-ui;padding:30px;background:#f2f7fa;color:#122c36}.ds-input{font:18px system-ui;padding:14px;border:1px solid #aac;border-radius:8px}.ds-dock{display:flex;gap:10px}#results{white-space:pre-wrap}button{padding:10px}</style>
<h1>Проверка расширения</h1><p id="engine"></p><button id="run">Запустить проверки</button><pre id="results"></pre>
<div class="ds-prompt">Name something you can see in the sky</div><p id="dynamic">HOW TO PLAY</p>
<form class="ds-dock"><input class="ds-input" aria-label="Your answer" placeholder="type one answer…" maxlength="256"><button type="submit">DIVE</button></form>
<script>
document.getElementById('engine').textContent='Встроенный Translator в тестовом браузере: '+('Translator' in window ? 'доступен' : 'не предоставлен')+'. Ниже тестируется логика с искусственным переводчиком.';
let submitted=[],received=[];
const input=document.querySelector('.ds-input');
input.addEventListener('input',()=>received.push(input.value));
document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();submitted.push(input.value);});
window.Translator={create:async(options)=>({translate:async(text)=>{
  await new Promise(r=>setTimeout(r,text==='облако'?120:20));
  if(options.sourceLanguage==='ru')return {'облако':'cloud','солнце':'sun','ошибка':''}[text]??'star';
  return 'Перевод '+text;
}})};
</script>
<script src="../extension/core.js"></script><script src="../extension/content.js"></script>
<script>
const results=document.getElementById('results');
function check(condition,name){if(!condition)throw Error(name);results.textContent+='PASS '+name+'\n';}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('run').onclick=async()=>{
try{
 const panel=document.getElementById('kr-ru-panel').shadowRoot;
 panel.getElementById('toggle').click();
 await wait(150);
 panel.getElementById('toggle').click();
 await wait(350);
 check(document.getElementById('dynamic').textContent==='КАК ИГРАТЬ','словарный перевод без замены узла');
 const clone=document.querySelector('[data-kr-ru-draft]');
 check(!!clone && input.hasAttribute('data-kr-ru-original'),'русское поле и отдельный оригинал');
 clone.value='облако';clone.dispatchEvent(new Event('input',{bubbles:true}));
 clone.value='солнце';clone.dispatchEvent(new Event('input',{bubbles:true}));
 await wait(220);
 check(input.value==='sun','поздний перевод облака не заменил солнце');
 check(!received.some(x=>/[а-яё]/i.test(x)),'русский текст не попал в состояние сайта');
 clone.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
 await wait(80);
 check(submitted.length===1 && submitted[0]==='sun','Enter отправил ровно один английский ответ');
 clone.value='облако';clone.dispatchEvent(new Event('input',{bubbles:true}));
 check(input.value==='','предыдущий ответ очищен немедленно');
 clone.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
 await wait(200);
 check(submitted.length===2 && submitted[1]==='cloud','Enter дождался перевода');
 clone.value='ошибка';clone.dispatchEvent(new Event('input',{bubbles:true}));
 await wait(80);
 clone.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
 await wait(80);
 check(submitted.length===2 && input.value==='','ошибка перевода не отправляет русский ответ');
 const dynamic=document.getElementById('dynamic');
 dynamic.textContent='Daily dive';await wait(180);
 check(dynamic.textContent==='Погружение дня','новая надпись переводится');
 panel.getElementById('toggle').click();
 check(dynamic.textContent==='Daily dive','оригинал восстановлен');
 check(!document.querySelector('[data-kr-ru-draft]') && !input.hasAttribute('data-kr-ru-original'),'поле восстановлено при выключении');
 results.textContent+='\nALL TESTS PASSED';
}catch(e){results.textContent+='\nFAIL '+e.message;}
};
</script></html>
